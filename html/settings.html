<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="../reset.css">
    <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
    <header class="encabezadoHome flex">
        <a href="" class="btnHome">Tu empresa aquí</a>
        <a href="" class="btnSalir">Salir</a>
    </header>

    <main class="contenido">
        <h1>Configuración de la empresa</h1>

        <div class="containerContenido flex">
            <div class="field">
                <label for="nombre">Nombre de la Empresa <span class="req">*</span></label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre de la empresa" required/>
            </div>

            <div class="field">
                <label for="slogan">Slogan</label>
                <input type="text" id="slogan" name="slogan" placeholder="Slogan de la empresa" />
            </div>

            <div class="field">
                <label   label for="tel1">Teléfono 1</label>
                <input type="tel" id="tel1" name="tel1" placeholder="Número de celular" required/>
            </div>

            <div class="field">
                <label for="tel2">Teléfono 2</label>
                <input type="tel" id="tel2" name="tel2" placeholder="Opcional" />
            </div>

            <div class="field">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Ej. 4a Calle, Zona 1" />
            </div>

            <div class="field">
                <span class="file-label">Subir Nuevo Logo (PNG/JPG)</span>
                <div class="file-wraper">
                    <button class="file-btn" data-fileBtn>
                        📁 Seleccionar archivo
                    </button>
                    <span class="file-name" id="fileName">Ningún archivo</span>
                </div>
                <input type="file" id="logoInput" name="logo" accept="image/png, image/jpeg" />
            </div>

            <div class="logo-section">
                <span class="logo-section-label">Logo Actual</span>
                <div class="logo-preview-box" id="logoPreview">
                    <div class="logo-placeholder" id="logoPlaceholder">
                        <span class="tu">TU</span>
                        <span class="logo-word">LOGO</span>
                        <span class="aqui">AQUÍ</span>
                    </div>
                </div>
            </div>

            <button class="btn-submit" type="button">Guardar Cambios</button>
        </div>
    </div>
    </main>

    <footer class="piePagina">
                <p> © 2026 Todos los derechos reservados.</p>
                <p class="devs">Desarollado por 
                    <a href="https://jose-sut10.github.io/Portafolio-personal/">Pixel Code</a>
                </p>
    </footer>
    <script type="module" src="../js/home/home.js"></script>
</body>
</html>
